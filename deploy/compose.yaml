# deploy/compose.yaml — one service and one state volume per site.
#
# This mirrors deploy/gateclerk-agent@.service: one site = one process = one sqlite
# store = one push target. Do not put two --site values in one service.
#
# `docker compose up -d` starts the ONE production site, site-a. A second site is
# opt-in through the `second-site` profile; it is never started by the default command:
#
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml --profile second-site up -d site-b
#
# Fill deploy/gateclerk.env from deploy/gateclerk.env.example (keep it mode 0600 and out
# of git), copy sites.toml and mnotify.toml beside it, put the mnotify secret files in
# ./mnotify-secrets (root-owned 0444 or uid 10001 0600, never committed), then build.
#
# The named volumes hold everything under --state-root: the store, park/ and health/.
# Each site also gets its own mnotify volume for [paths] audit + state_dir. The
# container root filesystem stays read-only; only those volumes and /tmp write.

name: gateclerk

x-agent: &agent
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: gateclerk-agent:local
  env_file:
    - ./gateclerk.env
  read_only: true
  tmpfs:
    - /tmp:size=16m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  restart: unless-stopped
  stop_grace_period: 30s

services:
  site-a:
    <<: *agent
    command:
      - agent
      - run
      - --site
      - site-a
      - --config
      - /etc/gateclerk/sites.toml
      - --state-root
      - /var/lib/gateclerk/site-a
    environment:
      TZ: Europe/Bucharest
      GATECLERK_HEALTH_FILE: /var/lib/gateclerk/site-a/health/agent.json
      MICRO_NOTIFY_CONFIG: /etc/mnotify/config.toml
      MICRO_NOTIFY_SECRETS: file
      MICRO_NOTIFY_SECRETS_DIR: /run/secrets/mnotify
    volumes:
      - ./sites.toml:/etc/gateclerk/sites.toml:ro
      - ./mnotify.toml:/etc/mnotify/config.toml:ro
      - ./mnotify-secrets:/run/secrets/mnotify:ro
      - site-a-state:/var/lib/gateclerk/site-a
      - site-a-mnotify:/var/lib/mnotify

  # A second site is the same block with its own name, config block, env vars and
  # volumes. It is gated behind a profile so the default production command starts
  # exactly one site; enable it deliberately on a host that really serves two sites.
  site-b:
    <<: *agent
    profiles: ["second-site"]
    command:
      - agent
      - run
      - --site
      - site-b
      - --config
      - /etc/gateclerk/sites.toml
      - --state-root
      - /var/lib/gateclerk/site-b
    environment:
      TZ: Europe/Bucharest
      GATECLERK_HEALTH_FILE: /var/lib/gateclerk/site-b/health/agent.json
      MICRO_NOTIFY_CONFIG: /etc/mnotify/config.toml
      MICRO_NOTIFY_SECRETS: file
      MICRO_NOTIFY_SECRETS_DIR: /run/secrets/mnotify
    volumes:
      - ./sites.toml:/etc/gateclerk/sites.toml:ro
      - ./mnotify.toml:/etc/mnotify/config.toml:ro
      - ./mnotify-secrets:/run/secrets/mnotify:ro
      - site-b-state:/var/lib/gateclerk/site-b
      - site-b-mnotify:/var/lib/mnotify

volumes:
  site-a-state:
  site-a-mnotify:
  site-b-state:
  site-b-mnotify:
